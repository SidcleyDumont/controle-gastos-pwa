<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="white"/>
    </linearGradient>
  </defs>
  <!-- Fundo arredondado azul -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Barra 1 (baixa) -->
  <rect x="8" y="40" width="13" height="18" rx="3" fill="white" fill-opacity="0.45"/>
  <!-- Barra 2 (média) -->
  <rect x="26" y="28" width="13" height="30" rx="3" fill="white" fill-opacity="0.7"/>
  <!-- Barra 3 (alta) -->
  <rect x="44" y="14" width="13" height="44" rx="3" fill="url(#bar3)"/>
  <!-- Linha de base -->
  <rect x="6" y="58" width="53" height="2" rx="1" fill="white" fill-opacity="0.3"/>
</svg>
